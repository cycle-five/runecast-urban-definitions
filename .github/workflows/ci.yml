name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE-*', '.gitignore']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE-*', '.gitignore']

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace


  docker-build:
    name: Docker build (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validate the service image builds (no push). image.yml only runs on
      # master/tags, so this is the pre-merge gate on the workspace-aware Dockerfile.
      - name: Build service image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
